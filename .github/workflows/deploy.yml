name: Deploy su Hostinger (SSH)

# Ad ogni push sul branch main, sincronizza i file su Hostinger via SSH/rsync.
on:
  push:
    branches: [main]        # ogni push su main pubblica in automatico
  workflow_dispatch: {}     # + avvio manuale dalla tab Actions

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Deploy su Hostinger via SSH (rsync)
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: "72.60.93.213"
          REMOTE_USER: "u200659392"
          REMOTE_PORT: "65002"
          SOURCE: "./"
          TARGET: "domains/ilcontadino.it/public_html/"
          # -rltgoDzv = ricorsivo, mantiene permessi/tempi, compresso, verboso.
          # NIENTE --delete: non cancelliamo nulla di già presente sul server.
          ARGS: "-rltgoDzv"
          EXCLUDE: ".git/, .github/, LEGGIMI.txt, README.md, .DS_Store"
